name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        configuration: [Debug, Release]

    steps:
    - uses: actions/checkout@v3
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration ${{ matrix.configuration }} --no-restore
      
    - name: Test Core Library
      run: |
        dotnet test tests/Cici.Tests/Cici.Tests.csproj \
          --configuration ${{ matrix.configuration }} \
          --no-build \
          --verbosity normal \
          --logger "trx;LogFileName=test-results.trx" \
          --logger "console;verbosity=detailed" \
          --results-directory ./test-results
      
    - name: Run Cici on Sample Tests
      if: matrix.configuration == 'Release' && matrix.os == 'ubuntu-latest'
      continue-on-error: true
      run: |
        dotnet run --project src/Cici.CLI/Cici.CLI.csproj -- run \
          --assembly samples/SampleTests/bin/${{ matrix.configuration }}/net8.0/SampleTests.dll \
          --repeat 5 \
          --report json \
          --output ./test-results
          
    - name: Upload Test Results
      if: always() && matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: ./test-results/
        retention-days: 30
        
    - name: Upload Cici Analysis Results
      if: matrix.configuration == 'Release' && matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: cici-analysis-results
        path: ./test-results/flaky-report.json
        if-no-files-found: ignore
        
  pack:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v3
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Pack NuGet packages
      run: |
        dotnet pack src/Cici/Cici.csproj --configuration Release --output ./artifacts
        dotnet pack src/Cici.CLI/Cici.CLI.csproj --configuration Release --output ./artifacts
        
    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg